name: LUMI 2.6.0 OURO - PWR touch e QMI8658 zonza
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/lumi-gold-compact-build.yml'
permissions:
  contents: write
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remover somente artefactos PT-BR ou de V5-V8 LUMI
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo,{owner,repo,per_page:100});
            let count=0;
            for(const a of artifacts){
              const n=a.name||'';
              if(!/lumi/i.test(n))continue;
              if(!/(?:^|[-_. ])(?:v[5-8](?:[._ -]|$)|pt[-_ ]?br(?:[-_ .]|$))/i.test(n))continue;
              await github.rest.actions.deleteArtifact({owner,repo,artifact_id:a.id});
              core.info('Removed nonfunctional artifact '+a.id+' '+n);
              count++;
            }
            core.info('Cleaned '+count+' eligible artifacts; kept stable backups/2.5.1.');
  build:
    needs: cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/lumi-260-gold-faces-baseline-20261117
          path: lumi
      - uses: actions/checkout@v4
        with:
          repository: 78/xiaozhi-esp32
          ref: 67ca62d4bb7d91e514d7ccd5e6977745002f41f4
          path: upstream
          submodules: recursive
      - name: Aplicar apenas as caras cor mel
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "67ca62d4bb7d91e514d7ccd5e6977745002f41f4"
          python3 lumi/tools/lumi-260-gold/patch_board.py upstream lumi/tools/lumi-260-gold/lumi_gold_face.h
          python3 lumi/tools/lumi-260-gold/patch_power_button.py upstream
          python3 lumi/tools/lumi-260-gold/patch_imu.py upstream lumi/tools/lumi-260-gold/lumi_shake_sensor.h
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p='main/boards/waveshare/esp32-s3-touch-lcd-1.54/esp32-s3-touch-lcd-1.54.cc'
          orig=subprocess.check_output(['git','-C','upstream','show',f'HEAD:{p}'],text=True)
          expected=orig.replace('#include "display/lcd_display.h"','#include "display/lcd_display.h"\n#include "lumi_gold_face.h"').replace('display_ = new SpiLcdDisplay(panel_io, panel,','display_ = new LumiGoldFaceDisplay(panel_io, panel,')
          modified=Path('upstream',p).read_text()
          button_start='        pwr_button_.OnPressUp([this]() {'
          button_end='        volume_up_button_.OnClick([this]() {'
          assert modified.count('        pwr_button_.OnPressDown([this]() {')==1
          assert button_start not in modified
          assert 'pwr_button_.OnPressUpDel();' not in modified
          assert 'pwr_button_.OnLongPress([this]() {' in modified
          assert 'pwr_button_.OnDoubleClick([this]() {' in modified
          assert 'pwr_button_.OnMultipleClick([this]() {' in modified
          # Only button block and the gold display constructor/header are allowed to differ.
          oldhead,oldrest=expected.split(button_start,1)
          _,oldsuffix=oldrest.split(button_end,1)
          newhead,newrest=modified.split('        // GPIO5: middle PWR button',1)
          _,newsuffix=newrest.split(button_end,1)
          # New IMU lines are intentionally the only additional difference to
          # the previously approved gold-face/PWR patch.
          newhead=newhead.replace('#include "lumi_shake_sensor.h"\n','')
          newhead=newhead.replace('    LumiShakeSensor* shake_sensor_ = nullptr;\n','')
          setup=('    void InitializeShakeSensor() {\n'
                 '        shake_sensor_ = new LumiShakeSensor();\n'
                 '        shake_sensor_->Start(i2c_bus_, static_cast<LumiGoldFaceDisplay*>(display_));\n'
                 '    }\n\n')
          newhead=newhead.replace(setup,'')
          newsuffix=newsuffix.replace('        InitializeShakeSensor();\n','')
          assert newhead==oldhead and newsuffix==oldsuffix
          assert Path('upstream/main/boards/waveshare/esp32-s3-touch-lcd-1.54/lumi_shake_sensor.h').is_file()
          assert subprocess.check_output(['git','-C','upstream','diff','--name-only'],text=True).splitlines()==[p]
          assert 'bool SetEmotion(const char* emotion) override' in Path('upstream/main/boards/waveshare/esp32-s3-touch-lcd-1.54/lumi_gold_face.h').read_text()
          PY
      - name: Compilar XiaoZhi oficial 2.6.0 Waveshare pt-PT
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          python3 scripts/build.py waveshare/esp32-s3-touch-lcd-1.54 --name esp32-s3-touch-lcd-1.54 --language pt-PT
          grep -qx 'CONFIG_LANGUAGE_PT_PT=y' sdkconfig
          grep -qx 'CONFIG_SR_WN_WN9_HIESP=y' sdkconfig
          test -s build/xiaozhi.bin
      - name: Verificar e empacotar candidato
        working-directory: upstream
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json,hashlib
          data=Path('build/xiaozhi.bin').read_bytes()
          assert data[0]==0xe9 and 1000000<len(data)<0x3f0000
          name='LUMI-2.6.0-OURO-app-CANDIDATA.bin'
          Path(name).write_bytes(data)
          manifest={'source_sha':'67ca62d4bb7d91e514d7ccd5e6977745002f41f4','board':'waveshare/esp32-s3-touch-lcd-1.54','version':'2.6.0','locale':'pt-PT','face':'#D8B35A','middle_button':'pwr_gpio5_onpressdown','touch':'tap_or_swipe_love_long_touch_toggle_chat','shake':'qmi8658_dizzy_optional','wake_word':'wn9_hiesp','app_sha256':hashlib.sha256(data).hexdigest(),'app_size':len(data),'runtime_tested':False,'safe_to_auto_flash':False,'install_prohibited_until_rollback_validated':True}
          Path('LUMI-manifest.json').write_text(json.dumps(manifest,indent=2))
          with ZipFile('LUMI-260-OURO-CANDIDATA-NAO-INSTALAR.zip','w') as z:
            z.write(name);z.write('LUMI-manifest.json')
          print('SHA256',manifest['app_sha256'])
          PY
      - name: Publicar release apenas de teste; sem gasto de artifact storage
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lumi-2.6.0-ouro-build-${{ github.run_id }}
          name: LUMI OURO 2.6.0 - PWR touch e IMU zonza
          prerelease: true
          make_latest: false
          body: 'Candidato experimental. PWR GPIO5 ao premir; touch carinho, touch longo interacao; IMU QMI8658 abanar gera cara zonza 2.3s, opcional. Mantem WakeNet stock Hi ESP. Preserva NVS/audio/assets. Instalar apenas depois de backup verificado.'
          files: |
            upstream/LUMI-260-OURO-CANDIDATA-NAO-INSTALAR.zip
            upstream/LUMI-manifest.json

name: LUMI Hub Android - APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lumi-hub-android/**'
      - '.github/workflows/lumi-hub-android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de teste
        run: gradle -p lumi-hub-android :app:assembleDebug --no-daemon --stacktrace

      - name: Verificar APK
        run: |
          test -s lumi-hub-android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh lumi-hub-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar APK do LUMI Hub
        uses: actions/upload-artifact@v4
        with:
          name: LUMI-Hub-Android-Tab15-v0.1
          path: lumi-hub-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

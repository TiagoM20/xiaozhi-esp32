name: LUMI Hub Android - APK assinado

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lumi-hub-android/**'
      - '.github/workflows/lumi-hub-android.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar Android SDK do runner
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          echo "$(dirname "$SDK_MANAGER")" >> "$GITHUB_PATH"
          "$SDK_MANAGER" --version

      - name: Preparar Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de teste
        run: gradle -p lumi-hub-android :app:assembleDebug --no-daemon --stacktrace

      - name: Verificar APK
        run: |
          test -s lumi-hub-android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh lumi-hub-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar APK do LUMI Hub
        uses: actions/upload-artifact@v4
        with:
          name: LUMI-Hub-Android-Tab15-v0.7.0
          path: lumi-hub-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Preparar assinatura permanente (se configurada)
        env:
          KEYSTORE_B64: ${{ secrets.LUMI_SIGNING_JKS_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LUMI_SIGNING_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "LUMI_HAS_SIGNING=false" >> "$GITHUB_ENV"
            echo "Assinatura de publicacao ainda nao configurada; so APK de teste sera gerado."
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lumi-release.jks"
            test -s "$RUNNER_TEMP/lumi-release.jks"
            echo "LUMI_RELEASE_KEYSTORE=$RUNNER_TEMP/lumi-release.jks" >> "$GITHUB_ENV"
            echo "LUMI_RELEASE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "LUMI_HAS_SIGNING=true" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK assinado para atualizacoes
        if: env.LUMI_HAS_SIGNING == 'true'
        run: gradle -p lumi-hub-android :app:assembleRelease --no-daemon

      - name: Verificar e preparar APK publicado
        if: env.LUMI_HAS_SIGNING == 'true'
        run: |
          test -s lumi-hub-android/app/build/outputs/apk/release/app-release.apk
          cp lumi-hub-android/app/build/outputs/apk/release/app-release.apk LUMI-Hub-v0.7.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs LUMI-Hub-v0.7.0.apk

      - name: Publicar versao Android no GitHub Releases
        if: env.LUMI_HAS_SIGNING == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lumi-hub-v0.7.0
          name: LUMI Hub 0.7.0 - Painel mural, memorias e voz MCP
          make_latest: false
          body: |
            Aplicacao Android LUMI Hub, versao 0.7.0.
            Painel mural, importacao local de memorias em JSON e ponte MCP para controlo de TV por voz.\n            A conexao MCP exige configuracao individual no tablet e testes de hardware.
            APK assinado com a chave persistente LUMI Studio.
            A atualizacao de versoes de teste com outra chave pode exigir migracao.
          files: LUMI-Hub-v0.7.0.apk

name: LUMI Native Portugues Ola ESP WakeNet10 Test

on:
  workflow_dispatch:
  push:
    branches: [experiment/lumi-portuguese-ola-esp-wakenet10-20261024]
    paths:
      - 'tools/lumi-firmware-253/**'
      - '.github/workflows/lumi-portuguese-ola-esp-253.yml'

permissions:
  contents: read

concurrency:
  group: lumi-native-pt-wakenet10
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
        with:
          path: lumi
      - uses: actions/checkout@v4
        with:
          repository: 78/xiaozhi-esp32
          ref: 7e69845d818553ac045efbcde746b22bef6eecf6
          path: lumi/upstream
      - name: Aplicar proteções Quiet ao XiaoZhi oficial
        working-directory: lumi
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/lumi-firmware-253/patch_upstream.py
      - name: Construir firmware e modelos WakeNet nativos
        working-directory: lumi/upstream
        shell: bash
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          python3 scripts/build.py waveshare/esp32-s3-touch-lcd-1.54 --name esp32-s3-touch-lcd-1.54 --language pt-PT --wake-word wn10_pt_olaesp
          test -s build/xiaozhi.bin
          test -s build/generated_assets.bin
      - name: Verificações e empacotamento sem flash automática
        working-directory: lumi/upstream
        shell: bash
        run: |
          set -euo pipefail
          echo "Native preset verification:"
          grep -E '(CONFIG_USE_AFE_WAKE_WORD|CONFIG_SR_WN_WN10_PT_OLAESP|CONFIG_SEND_WAKE_WORD_DATA|CONFIG_LANGUAGE_PT_PT)' sdkconfig || true
          grep -Fq 'espressif/esp-sr: ==2.6.0' main/idf_component.yml
          grep -Fxq 'CONFIG_USE_AFE_WAKE_WORD=y' sdkconfig
          grep -Fxq 'CONFIG_SR_WN_WN10_PT_OLAESP=y' sdkconfig
          grep -Fxq '# CONFIG_SEND_WAKE_WORD_DATA is not set' sdkconfig
          grep -Fxq 'CONFIG_LANGUAGE_PT_PT=y' sdkconfig
          grep -Fq 'LUMI Quiet: suppressing automatic greeting' main/application.cc
          grep -Fq 'LUMI Native: hard 12s no-STT timeout' main/application.cc
          grep -Fq 'LUMI Quiet: silent listening timeout' main/application.cc
          python3 -c 'import struct,pathlib; b=pathlib.Path("build/generated_assets.bin").read_bytes(); n,c,s=struct.unpack_from("<III",b); p=b[12:12+s]; assert 0<n<1000 and (sum(p)&65535)==c; names=[struct.unpack_from("<32sIIHH",p,i*44)[0].split(bytes([0]),1)[0].decode() for i in range(n)]; assert "srmodels.bin" in names; assert "index.json" in names; print("WakeNet assets:",names)'
          mkdir -p ../firmware-native
          cp build/xiaozhi.bin ../firmware-native/LUMI-OLA-ESP-PORTUGUES-app.bin
          cp build/generated_assets.bin ../firmware-native/LUMI-OLA-ESP-PORTUGUES-model-template.bin
          sha256sum ../firmware-native/*.bin > ../firmware-native/sha256.txt
          printf '%s\n' 'NÃO FLASHAR ESTAS IMAGENS DIRETAMENTE.' 'É NECESSARIO PRESERVAR GIFS E SUBSTITUIR APENAS O MODELO DE RECONHECIMENTO COM UM GESTOR DE ASSETS VALIDADO.' 'WakeNet10 Ola ESP treinado para portugues / lingua da assistente PT-PT / auto follow-up 15s / timeout sem STT 12s.' > ../firmware-native/LEIA-PRIMEIRO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LUMI-OLA-ESP-PT-WN10-EXPERIMENTAL-NAO-INSTALAR
          path: lumi/firmware-native/
          retention-days: 30

name: LUMI Quiet 2.5.3 Wake Fix - Olá Lumi mais responsivo

on:
  workflow_dispatch:
  push:
    branches: [fix/lumi-quiet-wake-0.30-20261023]
    paths:
      - 'tools/lumi-firmware-253/**'
      - '.github/workflows/lumi-desk-253.yml'

permissions:
  contents: read

concurrency:
  group: lumi-quiet-253-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lumi-desk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: espressif/idf:v6.1
    steps:
      - name: Obter patches LUMI
        uses: actions/checkout@v4
        with:
          path: lumi
          persist-credentials: false

      - name: Obter XiaoZhi 2.5.3 original, fixado a um commit
        uses: actions/checkout@v4
        with:
          repository: 78/xiaozhi-esp32
          ref: 7e69845d818553ac045efbcde746b22bef6eecf6
          path: lumi/upstream
          persist-credentials: false

      - name: Garantir versao e aplicar mudancas minimas
        shell: bash
        working-directory: lumi
        run: |
          set -euo pipefail
          cd upstream
          test "$(git rev-parse HEAD)" = "7e69845d818553ac045efbcde746b22bef6eecf6"
          cd ..
          python3 tools/lumi-firmware-253/patch_upstream.py

      - name: Compilar firmware ESP-IDF / Waveshare 1.54
        shell: bash
        working-directory: lumi/upstream
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          python3 scripts/build.py waveshare/esp32-s3-touch-lcd-1.54 \
            --name esp32-s3-touch-lcd-1.54 --language pt-PT --wake-word lumi_custom
          test -s build/xiaozhi.bin

      - name: Verificar build e protecoes, sem alterar GIFs ou NVS
        shell: bash
        working-directory: lumi/upstream
        run: |
          set -euo pipefail
          grep -Fxq 'CONFIG_USE_CUSTOM_WAKE_WORD=y' sdkconfig
          grep -Fxq 'CONFIG_LANGUAGE_PT_PT=y' sdkconfig
          grep -Fxq 'CONFIG_SR_MN_EN_MULTINET6_QUANT=y' sdkconfig
          grep -Fxq '# CONFIG_USE_DEVICE_AEC is not set' sdkconfig
          grep -Fxq '# CONFIG_USE_SERVER_AEC is not set' sdkconfig
          grep -Fq 'LUMI: ignoring wake event during conversation' main/application.cc
          grep -Fxq '# CONFIG_SEND_WAKE_WORD_DATA is not set' sdkconfig
          grep -Fxq 'CONFIG_CUSTOM_WAKE_WORD_THRESHOLD=30' sdkconfig
          grep -Fq 'LUMI Quiet: suppressing automatic greeting' main/application.cc
          grep -Fq 'LUMI Quiet: idle expression' main/application.cc
          grep -Fq 'LUMI Quiet: silent listening timeout' main/application.cc
          grep -Fq 'LUMI Quiet: wake threshold' main/audio/wake_words/custom_wake_word.cc
          grep -Fq 'audio_service_.EnableWakeWordDetection(false)' main/application.cc
          grep -Fq 'ShowStartupWakeWordHint()' main/application.cc
          test "$(stat -c%s build/xiaozhi.bin)" -gt 1000000
          mkdir -p ../firmware-candidato
          cp build/xiaozhi.bin ../firmware-candidato/LUMI-DESK-2.5.3-QUIET-WAKE-FIX-app.bin
          cp sdkconfig ../firmware-candidato/sdkconfig.txt
          sha256sum ../firmware-candidato/*.bin > ../firmware-candidato/sha256.txt
          cat > ../firmware-candidato/LEIA-PRIMEIRO.txt <<'EOF'
          LUMI QUIET 2.5.3 - FIRMWARE EXPERIMENTAL
          Hardware: Waveshare ESP32-S3-Touch-LCD-1.54
          Original upstream: 7e69845d818553ac045efbcde746b22bef6eecf6
          Personalizacoes: Ola Lumi; ignorar wake quando fala; esperar fim audio;
          timeout 6s sem STT / 15s com STT; sem saudacao automatica;
          threshold 0.30 para MultiNet; caras sleepy/neutral/sad/happy a cada 90s.
          ATENCAO: voz Raquel e servida pela consola oficial XiaoZhi, nao vem no .bin.
          AUDIO, WIFI, ANIMACOES E HARDWARE NAO VALIDADOS FISICAMENTE.
          ATENCAO: Este ficheiro e APENAS a particao de aplicacao.
          NAO usar "Erase Flash". NAO gravar este binario em 0x0.
          Nao substituir recursos, NVS ou particoes. Necessita plano de rollback
          e validacao do offset/OTA antes de instalar na DESK em funcionamento.
          BACKUP FUNCIONAL: release lumi-2.5.1-build-8 do proprio repositorio.
          EOF

      - name: Entregar candidato sem publicar atualizacao automatica
        uses: actions/upload-artifact@v4
        with:
          name: LUMI-DESK-QUIET-WAKE-FIX-CANDIDATO-NAO-INSTALAR
          path: lumi/firmware-candidato/
          retention-days: 30

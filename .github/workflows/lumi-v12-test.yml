name: LUMI V12 - APK assinado e firmware de teste
on:
  workflow_dispatch:
  push:
    branches: [feature/lumi-v12-hub-desk-20261013]
    paths:
      - 'lumi-hub-android/**'
      - 'main/application.cc'
      - '.github/workflows/lumi-v12-test.yml'
concurrency:
  group: lumi-v12-test-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar conversor de áudio Opus
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Incorporar amostra original Raquel PT-PT como Opus 24 kHz / 60 ms
        run: |
          set -e
          mkdir -p lumi-hub-android/app/src/main/assets
          curl -fLsS --retry 3 --max-time 60 \
            https://github.com/TiagoM20/xiaozhi-esp32/releases/download/lumi-voice-ptpt-demo-v0.1/LUMI-Raquel-PTPT-Demo.mp3 \
            -o /tmp/lumi-raquel-demo.mp3
          test "$(stat -c%s /tmp/lumi-raquel-demo.mp3)" -gt 15000
          ffmpeg -hide_banner -loglevel error -y -i /tmp/lumi-raquel-demo.mp3 \
            -ar 24000 -ac 1 -c:a libopus -b:a 32k -frame_duration 60 -vbr off \
            -application voip -f ogg /tmp/lumi-raquel-60ms.ogg
          python3 tools/lumi-v12/ogg_packets.py /tmp/lumi-raquel-60ms.ogg \
            lumi-hub-android/app/src/main/assets/lumi-raquel-24k-60ms.pkt
          test -s lumi-hub-android/app/src/main/assets/lumi-raquel-24k-60ms.pkt
      - name: Diagnosticar classes da biblioteca Opus
        run: |
          gradle -p lumi-hub-android :app:dependencies --configuration debugCompileClasspath --no-daemon | grep -i -C 2 concentus || true
          find ~/.gradle/caches/modules-2/files-2.1 -name '*concentus*.jar' -print -exec sh -c 'jar tf "$1" | head -n 30' _ {} \; || true
      - name: Inspecionar pacote Maven Opus
        run: |
          curl -fLsS --retry 2 'https://repo.maven.apache.org/maven2/io/github/jaredmdobson/concentus/1.0.2/concentus-1.0.2.jar' -o /tmp/lumi-concentus.jar
          jar tf /tmp/lumi-concentus.jar | head -n 15
          jar tf /tmp/lumi-concentus.jar | grep -Ei 'Opus(Encoder|Decoder|Application)' | head -n 15
      - name: Compilar V12 de diagnostico
        run: gradle -p lumi-hub-android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LUMI-HUB-V12-debug-NAO-ATUALIZA-APP-ASSINADA
          path: lumi-hub-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Preparar assinatura de atualizacao
        env:
          KEYSTORE_B64: ${{ secrets.LUMI_SIGNING_JKS_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LUMI_SIGNING_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lumi-release.jks"
            echo "LUMI_RELEASE_KEYSTORE=$RUNNER_TEMP/lumi-release.jks" >> "$GITHUB_ENV"
            echo "LUMI_RELEASE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "LUMI_SIGN=true" >> "$GITHUB_ENV"
          fi
      - name: Compilar APK assinado (para atualizar V11)
        if: env.LUMI_SIGN == 'true'
        run: gradle -p lumi-hub-android :app:assembleRelease --no-daemon
      - name: Verificar assinatura e disponibilizar APK assinado
        if: env.LUMI_SIGN == 'true'
        run: |
          cd lumi-hub-android/app/build/outputs/apk/release
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app-release.apk
          cp app-release.apk LUMI-HUB-V12-TESTE-ASSINADO.apk
      - uses: actions/upload-artifact@v4
        if: env.LUMI_SIGN == 'true'
        with:
          name: LUMI-HUB-V12-assinado-testes
          path: lumi-hub-android/app/build/outputs/apk/release/LUMI-HUB-V12-TESTE-ASSINADO.apk
          retention-days: 14
      - name: Publicar V12 RC1 assinada (sem substituir ultima release firmware)
        if: env.LUMI_SIGN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lumi-hub-v0.12.3
          name: LUMI HUB V12.3 - Interface e diagnóstico da DESK
          target_commitish: feature/lumi-v12-hub-desk-20261013
          prerelease: true
          make_latest: false
          body: |
            LUMI HUB 0.12.3, atualização experimental assinada sobre a V12.2.
            LUMI DESK simplificada: Configurações e Diagnóstico/histórico.
            Diagnóstico local privado com eventos, transcrições, respostas e exportação .txt.
            Integração MCP movida para Configurações e testes de voz recolhidos na área avançada.
            Cinco novos temas (Areia, Floresta, Rosa Névoa, Terracota, Minimal).
            Mantém os cinco temas originais, memórias, dispositivos e atualizações pelo HUB.
            Azure Speech e OpenAI continuam dependentes de configuração no tablet.
            Não atualiza o firmware da Waveshare nem altera os 21 GIFs.
            Versão de testes: conversa real e áudio sem falhas continuam por validar em hardware.
          files: lumi-hub-android/app/build/outputs/apk/release/LUMI-HUB-V12-TESTE-ASSINADO.apk
  build-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar configuracao LUMI DESK estavel
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path("main/boards/waveshare/esp32-s3-touch-lcd-1.54/config.json")
          config=json.loads(path.read_text(encoding="utf-8"))
          overrides={
            "CONFIG_USE_DEVICE_AEC":"n","CONFIG_USE_SERVER_AEC":"n",
            "CONFIG_WAKE_WORD_DISABLED":"n","CONFIG_USE_ESP_WAKE_WORD":"n",
            "CONFIG_USE_AFE_WAKE_WORD":"n","CONFIG_USE_CUSTOM_WAKE_WORD":"y",
            "CONFIG_CUSTOM_WAKE_WORD":'"ola lumi"',
            "CONFIG_CUSTOM_WAKE_WORD_DISPLAY":'"Olá Lumi"',
            "CONFIG_CUSTOM_WAKE_WORD_THRESHOLD":"20",
            "CONFIG_SEND_WAKE_WORD_DATA":"y","CONFIG_SR_MN_CN_NONE":"y",
            "CONFIG_SR_MN_EN_MULTINET6_QUANT":"y"
          }
          cfg=config["builds"][0]["sdkconfig_append"]
          cfg=[x for x in cfg if x.split("=",1)[0] not in overrides]
          cfg += [f"{k}={v}" for k,v in overrides.items()]
          config["builds"][0]["sdkconfig_append"]=cfg
          path.write_text(json.dumps(config,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Compilar firmware de compatibilidade V12
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python3 scripts/build.py waveshare/esp32-s3-touch-lcd-1.54 \
            --name esp32-s3-touch-lcd-1.54 --language pt-PT
          grep -qx 'CONFIG_USE_CUSTOM_WAKE_WORD=y' sdkconfig
          grep -qx 'CONFIG_LANGUAGE_PT_PT=y' sdkconfig
          test -s build/xiaozhi.bin
      - uses: actions/upload-artifact@v4
        with:
          name: LUMI-DESK-V12-firmware-CANDIDATO-NAO-INSTALAR
          path: |
            build/xiaozhi.bin
            sdkconfig
          retention-days: 14

name: LUMI V7 CORE SD media experimental
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [lumi/v7-core-sd-media-lazy]
    paths:
      - '.github/workflows/lumi-v7-core-sd-media.yml'
      - 'main/CMakeLists.txt'
      - 'main/boards/waveshare/esp32-s3-touch-lcd-1.54/**'
      - 'main/idf_component.yml'
      - 'main/audio/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Configure WakeNet10 Portuguese
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('main/boards/waveshare/esp32-s3-touch-lcd-1.54/config.json')
          cfg=json.loads(p.read_text(encoding='utf-8'))
          overrides={
            'CONFIG_USE_DEVICE_AEC':'n',
            'CONFIG_USE_SERVER_AEC':'n',
            'CONFIG_WAKE_WORD_DISABLED':'n',
            'CONFIG_USE_AFE_WAKE_WORD':'y',
            'CONFIG_USE_CUSTOM_WAKE_WORD':'n',
            'CONFIG_USE_ESP_WAKE_WORD':'n',
            'CONFIG_WAKE_WORD_DETECTION_IN_LISTENING':'n',
            'CONFIG_SEND_WAKE_WORD_DATA':'y',
            'CONFIG_SR_WN_WN9_NIHAOXIAOZHI_TTS':'n',
            'CONFIG_SR_WN_WN10_PT_OLAESP':'y',
            'CONFIG_SR_MN_CN_NONE':'y',
            'CONFIG_SR_MN_EN_NONE':'y'}
          opts=cfg['builds'][0]['sdkconfig_append']
          cfg['builds'][0]['sdkconfig_append']=[o for o in opts if o.split('=')[0] not in overrides]+[f'{k}={v}' for k,v in overrides.items()]
          p.write_text(json.dumps(cfg,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
      - name: Verify lazy media integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          board=Path('main/boards/waveshare/esp32-s3-touch-lcd-1.54/esp32-s3-touch-lcd-1.54.cc').read_text()
          service=Path('main/boards/waveshare/esp32-s3-touch-lcd-1.54/lumi_sd_media.cc').read_text()
          constructor=board.split('CustomBoard() :',1)[1].split('virtual AudioCodec*',1)[0]
          assert 'Mount()' not in constructor and 'InitializeSdCard' not in constructor
          assert 'esp_vfs_fat_sdmmc_mount' in service
          assert 'format_if_mount_failed = false' in service
          assert 'slot.width = 1' in service
          assert 'slot.d1 = GPIO_NUM_NC' in service
          assert 'self.sdcard.play_audio' in board and 'self.sdcard.show_image' in board
          assert 'self.timer.start' in board
          print('SD features opt-in; firmware has no boot-time mount')
          PY
      - name: Build firmware and matching model
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python3 scripts/build.py waveshare/esp32-s3-touch-lcd-1.54 --name esp32-s3-touch-lcd-1.54 --language pt-PT
      - name: Validate and package
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          cfg=Path('sdkconfig').read_text()
          for s in ('CONFIG_USE_AFE_WAKE_WORD=y','CONFIG_SR_WN_WN10_PT_OLAESP=y','CONFIG_LANGUAGE_PT_PT=y','# CONFIG_USE_CUSTOM_WAKE_WORD is not set'):
            assert s in cfg.splitlines(),s
          fw=Path('build/xiaozhi.bin').read_bytes()
          assets=Path('build/generated_assets.bin').read_bytes()
          assert fw[0]==0xe9 and 100000<len(fw)<0x3f0000
          assert b'wn10_pt_olaesp' in assets and 12<len(assets)<0x800000
          manifest={'format':'lumi-core-v7-experimental','features':['sd_lazy_mount','sd_media_ogg_opus_stream','sd_image_jpg_png','offline_timer','sd_diagnostics'],'sd_policy':'explicit_mount_no_autoformat','board':'waveshare/esp32-s3-touch-lcd-1.54','chip':'esp32s3','sr_version':'2.6.1','wake_word':'Olá ESP','wake_model':'wn10_pt_olaesp','wake_word_lumi_ready':False,'flash_size':16777216,'firmware':{'name':'firmware.bin','sha256':hashlib.sha256(fw).hexdigest(),'size':len(fw)},'model_assets':{'name':'model-assets.bin','sha256':hashlib.sha256(assets).hexdigest(),'size':len(assets)},'assets_policy':'merge-only-srmodels-preserving-existing-fonts-and-emojis'}
          with ZipFile('LUMI-V7-CORE-SD-Media-Experimental.zip','w',ZIP_DEFLATED,compresslevel=6) as z:
            z.writestr('manifest.json',json.dumps(manifest,indent=2,ensure_ascii=False))
            z.writestr('firmware.bin',fw)
            z.writestr('model-assets.bin',assets)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LUMI-V7-CORE-SD-Media-Experimental
          path: LUMI-V7-CORE-SD-Media-Experimental.zip
          retention-days: 30
      - name: Publish opt-in experimental release
        if: false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lumi-wakenet10-pt-test
          target_commitish: ${{ github.sha }}
          name: LUMI WakeNet10 PT experimental
          prerelease: true
          make_latest: false
          files: LUMI-V7-CORE-SD-Media-Experimental.zip
          fail_on_unmatched_files: true
          overwrite_files: true

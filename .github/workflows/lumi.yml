name: LUMI 2.5.1 - Ola Lumi - Sem interrupcoes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lumi.yml'
      - 'main/application.cc'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v6.1

    steps:
      - name: Obter codigo XiaoZhi
        uses: actions/checkout@v4

      - name: Configurar LUMI
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("main/boards/waveshare/esp32-s3-touch-lcd-1.54/config.json")
          config = json.loads(path.read_text(encoding="utf-8"))
          options = config["builds"][0]["sdkconfig_append"]
          overrides = {
              "CONFIG_USE_DEVICE_AEC": "n",
              "CONFIG_USE_SERVER_AEC": "n",
              "CONFIG_WAKE_WORD_DISABLED": "n",
              "CONFIG_USE_ESP_WAKE_WORD": "n",
              "CONFIG_USE_AFE_WAKE_WORD": "n",
              "CONFIG_USE_CUSTOM_WAKE_WORD": "y",
              "CONFIG_CUSTOM_WAKE_WORD": '"ola lumi"',
              "CONFIG_CUSTOM_WAKE_WORD_DISPLAY": '"Olá Lumi"',
              "CONFIG_CUSTOM_WAKE_WORD_THRESHOLD": "20",
              "CONFIG_SEND_WAKE_WORD_DATA": "y",
              "CONFIG_SR_MN_CN_NONE": "y",
              "CONFIG_SR_MN_EN_MULTINET6_QUANT": "y",
          }
          options = [
              item for item in options
              if item.split("=", 1)[0] not in overrides
          ]
          options.extend(f"{key}={value}" for key, value in overrides.items())
          config["builds"][0]["sdkconfig_append"] = options
          path.write_text(
              json.dumps(config, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Verificar codigo anti-interrupcoes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('main/application.cc').read_text(encoding='utf-8')
          a = source.index('void Application::HandleWakeWordDetectedEvent() {')
          b = source.index('void Application::BeginWakeWordInvoke(', a)
          handler = source[a:b]
          a = source.index('        case kDeviceStateSpeaking:')
          b = source.index('        case kDeviceStateNotifying:', a)
          speaking = source[a:b]
          assert 'AbortSpeaking(' not in handler, 'Wake handler ainda cancela a fala'
          assert 'ignoring wake event during conversation' in handler
          assert 'audio_service_.EnableWakeWordDetection(false);' in speaking
          assert 'audio_service_.EnableWakeWordDetection(audio_service_.IsAfeWakeWord())' not in speaking
          a = source.index('void Application::ConfigureWakeWordForListening() {')
          b = source.index('void Application::StartNotification(', a)
          assert 'audio_service_.EnableWakeWordDetection(false);' in source[a:b]
          assert 'pending_listening_start_' in source
          assert 'listening_silence_since_us_' in source
          assert '15000000' in source
          assert 'LUMI: 15s silence, closing conversation' in source
          assert '15s silence' in source
          header = Path('main/application.h').read_text(encoding='utf-8')
          assert 'int64_t listening_silence_since_us_' in header
          print('LUMI: wake bloqueada durante fala; silencio limitado a 15 segundos.')
          PY

      - name: Compilar firmware LUMI
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python3 scripts/build.py \
            waveshare/esp32-s3-touch-lcd-1.54 \
            --name esp32-s3-touch-lcd-1.54 \
            --language pt-PT

      - name: Verificar configuracao
        shell: bash
        run: |
          grep -qx 'CONFIG_USE_CUSTOM_WAKE_WORD=y' sdkconfig
          grep -qx 'CONFIG_SR_MN_EN_MULTINET6_QUANT=y' sdkconfig
          grep -qx 'CONFIG_LANGUAGE_PT_PT=y' sdkconfig
          grep -qx '# CONFIG_USE_DEVICE_AEC is not set' sdkconfig
          grep -qx '# CONFIG_USE_SERVER_AEC is not set' sdkconfig
          test -s build/xiaozhi.bin
          echo "LUMI: protecao contra cancelamentos e escuta apos fala compilados."

      - name: Guardar firmware
        uses: actions/upload-artifact@v4
        with:
          name: LUMI-2.5.1-Ola-Lumi-Sem-Interrupcoes
          path: |
            build/xiaozhi.bin
            sdkconfig
          retention-days: 7

plugins {
    id 'com.android.application'
}

android {
    namespace 'pt.lumistudio.lumihub'
    compileSdk 35
    // Sideload para Android 12; alvo 32 preserva o comportamento do serviço atual.
    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    defaultConfig {
        applicationId 'pt.lumistudio.lumihub'
        minSdk 26
        targetSdk 32
        versionCode 9
        versionName '0.8.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
}

def releaseStore = System.getenv("LUMI_RELEASE_KEYSTORE")
def releasePass = System.getenv("LUMI_RELEASE_PASSWORD")
if (releaseStore && releasePass) {
    android.signingConfigs {
        lumiRelease {
            storeFile file(releaseStore)
            storePassword releasePass
            keyAlias 'lumihub'
            keyPassword releasePass
        }
    }
    android.buildTypes.release.signingConfig android.signingConfigs.lumiRelease
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'pt.lumistudio.lumihub'
    compileSdk 35

    defaultConfig {
        applicationId 'pt.lumistudio.lumihub'
        minSdk 26
        targetSdk 32
        versionCode 5
        versionName '0.5.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
}
